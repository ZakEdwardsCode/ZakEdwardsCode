<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Editing Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-center: #1e2766;
    --bg-edge: #141a48;
    --card: #1f2867;
    --card-line: rgba(130, 160, 255, 0.38);
    --text: #c9d5ff;
    --sky: #6db5f5;
    --cyan: #7fd3f2;
    --ink: #13194a;
    --coral: #f2666a;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-edge); color: var(--text); }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Fixed 1600×900 stage, scaled to fit the viewport */
  .frame { position: relative; width: 1600px; height: 900px; flex: none; }
  .stage {
    position: absolute; top: 0; left: 0;
    width: 1600px; height: 900px;
    transform-origin: 0 0;
    background: radial-gradient(ellipse 60% 65% at 50% 48%, var(--bg-center), var(--bg-edge));
    overflow: hidden;
    font-family: var(--sans);
  }

  .mono {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
  }

  header { position: absolute; left: 96px; top: 52px; }
  header .kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: 34px;
    line-height: 1.1;
    color: var(--sky);
    margin-bottom: 10px;
  }
  header h1 {
    display: inline-block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--ink);
    background: var(--sky);
    padding: 6px 18px 4px;
  }

  svg.wires { position: absolute; inset: 0; pointer-events: none; }

  .card {
    position: absolute;
    top: 604px;
    width: 260px; height: 96px;
    background: var(--card);
    border: 1px solid var(--card-line);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px 0 22px;
  }
  .card > svg { flex: none; width: 24px; height: 24px; stroke: var(--coral); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .card h2 { font-family: var(--sans); font-weight: 500; font-size: 20px; letter-spacing: -0.01em; color: var(--text); margin-bottom: 8px; white-space: nowrap; }
  .card .mono { white-space: nowrap; letter-spacing: 0.12em; }
  .card .num { position: absolute; top: 10px; right: 12px; color: var(--coral); font-size: 10px; }

  .opus {
    position: absolute;
    left: 660px; top: 290px; width: 280px; height: 116px;
    background: var(--cyan);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .opus h2 { font-family: var(--serif); font-weight: 400; font-size: 50px; line-height: 1; margin-bottom: 12px; }
  .opus .mono { color: var(--ink); }

  .tag { position: absolute; color: var(--coral); }
</style>
</head>
<body>
<div class="frame" id="frame">
<div class="stage" id="stage">

  <header>
    <div class="kicker">AI-assisted video editing,</div>
    <h1>END TO END</h1>
  </header>

  <svg class="wires" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M1 1 L9 5 L1 9" fill="none" stroke="#f2666a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <!-- Opus orchestrates every step -->
    <g fill="none" stroke="#f2666a" stroke-width="1.6" stroke-dasharray="5 5">
      <path d="M800 406 C800 500, 208 500, 208 600"/>
      <path d="M800 406 C800 500, 504 510, 504 600"/>
      <path d="M800 406 V600"/>
      <path d="M800 406 C800 500, 1096 510, 1096 600"/>
      <path d="M800 406 C800 500, 1392 500, 1392 600"/>
    </g>
    <!-- Step flow, left → right -->
    <g fill="none" stroke="#f2666a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)">
      <path d="M342 652 H370"/>
      <path d="M638 652 H666"/>
      <path d="M934 652 H962"/>
      <path d="M1230 652 H1258"/>
    </g>
    <!-- Review loop: step 4 feeds changes back into Remotion -->
    <path d="M1096 704 C1096 784, 800 784, 800 708" fill="none" stroke="#f2666a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </svg>

  <div class="tag mono" style="left:870px; top:780px;">↻ Iterate until approved</div>

  <div class="opus">
    <h2>Opus 5.5</h2>
    <div class="mono">→ Orchestrates every step</div>
  </div>

  <!-- 1 -->
  <div class="card" style="left:78px;">
    <span class="num mono">01</span>
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m10.5 11 4 2.5-4 2.5z"/></svg>
    <div><h2>Raw footage</h2><div class="mono">Google Drive</div></div>
  </div>

  <!-- 2 -->
  <div class="card" style="left:374px;">
    <span class="num mono">02</span>
    <svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5"/><path d="M12 11v9m-3-3 3 3 3-3"/></svg>
    <div><h2>Cloud workspace</h2><div class="mono">~31GB per chat</div></div>
  </div>

  <!-- 3 -->
  <div class="card" style="left:670px;">
    <span class="num mono">03</span>
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="m10.5 7.5 4 2.5-4 2.5z"/><path d="M3 20h5m3 0h4m3 0h3"/></svg>
    <div><h2>Edit in Remotion</h2><div class="mono">Pre-installed</div></div>
  </div>

  <!-- 4 -->
  <div class="card" style="left:966px;">
    <span class="num mono">04</span>
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9"/><path d="M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3.5v3.8h-3.8"/><path d="M5.5 20.5v-3.8h3.8"/></svg>
    <div><h2>Review loop</h2><div class="mono">Suggest → flag → apply</div></div>
  </div>

  <!-- 5 -->
  <div class="card" style="left:1262px;">
    <span class="num mono">05</span>
    <svg viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <div><h2>Polished export</h2><div class="mono">Render → Drive</div></div>
  </div>

</div>
</div>
<script>
  (function () {
    var frame = document.getElementById('frame');
    var stage = document.getElementById('stage');
    function fit() {
      var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      if (window.innerWidth < 900) s = window.innerWidth / 1600; // phones: fill width
      stage.style.transform = 'scale(' + s + ')';
      frame.style.width = 1600 * s + 'px';
      frame.style.height = 900 * s + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
