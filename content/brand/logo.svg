  <text x="0" y="68" font-family="Plasmo Display, Inter Display, Inter, sans-serif" font-weight="900" font-size="84" letter-spacing="-4"><tspan fill="currentColor">Plas</tspan><tspan fill="url(#pmo)">mo</tspan></text>
